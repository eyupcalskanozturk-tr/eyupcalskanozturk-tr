name: Dörtlü

# README'deki Dörtlü oyunu: ziyaretçi bir sütuna tıklayınca "dortlu|sutun|N" başlıklı
# bir issue açılır. Bu iş hamleyi oynar, botun cevabını hesaplar, tahtayı ve README'yi
# günceller, issue'ya cevap yazıp kapatır. Issue girdileri yalnızca ortam değişkeniyle
# betiğe verilir ve betikte sıkı kalıplarla doğrulanır.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: dortlu
  cancel-in-progress: false # hamleler sıraya girsin, hiçbiri kaybolmasın

jobs:
  move:
    if: startsWith(github.event.issue.title, 'dortlu|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }} # her zaman en güncel tahta

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hamleyi oyna
        id: play
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: node game/dortlu.mjs move

      - name: Tahtayı kaydet
        if: steps.play.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/dortlu.json game/dortlu.svg
          git commit -q -m "Dörtlü: yeni hamle (#${ISSUE_NUMBER})"
          git pull -q --rebase
          git push -q

      - name: Cevapla ve issue'yu kapat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: |
          [ -s "$REPLY_FILE" ] || echo "Hamleni işlerken bir sorun çıktı; birazdan tekrar dener misin?" > "$REPLY_FILE"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$REPLY_FILE"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
