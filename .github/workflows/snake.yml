name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: eyupcalskanozturk-tr
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#FFD700&color_dots=#0a0a0a,#1a4a1a,#2d7a2d,#39FF14,#7fff5c

      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
