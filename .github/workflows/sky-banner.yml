name: Çanakkale gökyüzü başlığı

# README başlığını Çanakkale'nin o anki gökyüzüyle yeniden çizer.
# Sonuç, geçmiş tutulmadan "sky" dalına yazılır; main dalı kirlenmez.
on:
  schedule:
    - cron: "17,47 * * * *" # yarım saatte bir (GitHub zamanlanmış işleri birkaç dakika geciktirebilir)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sky-banner.mjs"
      - "scripts/name-paths.json"
      - ".github/workflows/sky-banner.yml"

permissions:
  contents: write

concurrency:
  group: sky-banner
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gökyüzünü çiz
        run: node scripts/sky-banner.mjs dist/sky-banner.svg

      - name: sky dalına yayınla
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b sky
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sky-banner.svg
          git commit -q -m "Gökyüzü başlığı: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sky
