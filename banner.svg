<svg width="100%" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eyüp Çalışkanoztürk • Gold Banner">
  <defs>
    <!-- Altın akışlı degrade -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8a6d3b"/>
      <stop offset="25%"  stop-color="#d4af37"/>
      <stop offset="50%"  stop-color="#ffd700"/>
      <stop offset="75%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d3b"/>
      <animate attributeName="x1" values="0%;100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Parlama efekti -->
    <linearGradient id="shine" x1="-20%" y1="0%" x2="20%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="shineMask">
      <rect x="0" y="0" width="1200" height="120" fill="black"/>
      <rect x="-300" y="0" width="300" height="120" fill="url(#shine)">
        <animate attributeName="x" from="-300" to="1200" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <!-- Arka plan -->
  <rect width="1200" height="120" fill="transparent"/>

  <!-- Ana başlık -->
  <g mask="url(#shineMask)">
    <text x="50%" y="58" text-anchor="middle"
          font-family="Segoe UI, Arial, Helvetica, sans-serif"
          font-size="38" font-weight="800"
          fill="url(#goldGradient)" stroke="#332a14" stroke-width="1.2">
      Eyüp Çalışkanoztürk
    </text>
  </g>

  <!-- Alt başlık -->
  <text x="50%" y="92" text-anchor="middle"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="18" font-weight="600"
        fill="#b89d36">
    Bilgisayar Programcılığı • Web Arayüz • C# • Algoritmalar
  </text>
